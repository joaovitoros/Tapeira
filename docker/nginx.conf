# nginx configuration for TAPeira (static browser build).
# Loaded as /etc/nginx/conf.d/default.conf inside the unprivileged image,
# which runs as UID 101 and cannot bind privileged ports -> listen on 8080.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- Security headers -------------------------------------------------
    # Sent on every response (including errors) thanks to "always".
    # NOTE: keep these at server level only. A nested add_header would reset
    # inheritance, so the caching rules below use "expires" instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # --- Caching ----------------------------------------------------------
    # Hashed-at-build assets are safe to cache for a long time.
    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|mp3|wav|ogg)$ {
        expires    30d;
        access_log off;
    }

    # HTML entry points must always be revalidated so players get new versions.
    location = /index.html {
        expires -1;
    }
    location = /Caverna.html {
        expires -1;
    }

    # --- Health probe used by the Docker HEALTHCHECK ----------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Everything else --------------------------------------------------
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
