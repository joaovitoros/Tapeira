<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<link rel="stylesheet" href="css/estilos.css">
	<script src="script/break_infinity.min.js"></script>
	<script src="script/sistema.js"></script>
	<script src="script/audio.js"></script>

<body onload="PrepararMenu()">
	<main id="menu-container">
		<section id="menu-card" aria-labelledby="menu-title">
			<div id="menu-eyebrow">UMA AVENTURA SOB A MONTANHA</div>
			<h1 id="menu-title">TAPeira</h1>
			<p id="menu-subtitle">Explore a caverna, derrote os Mugs e fortaleça sua equipe.</p>

			<div id="menu-save-card" aria-live="polite">
				<div id="menu-save-status">Nenhuma aventura salva</div>
				<div id="menu-save-details">Sua jornada começará no primeiro andar.</div>
				<div id="menu-offline-time" hidden></div>
			</div>

			<button type="button" id="btn-Jogar" onclick="Menu()">Entrar na caverna</button>
			<button type="button" id="btn-SairJogo" hidden onclick="SairDoJogo()">Fechar jogo</button>
			<div id="menu-hint">Seu progresso é salvo automaticamente durante a aventura.</div>
		</section>
	</main>
</body>
